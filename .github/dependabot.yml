# Keeps the actions and modules current. Actions are pinned to their major
# version, so Dependabot proposes a new major; modules get every release.
# Each update is a pull request that CI checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /examples/demo
    schedule:
      interval: weekly
