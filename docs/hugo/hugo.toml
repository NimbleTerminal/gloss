baseURL = "https://nimbleterminal.github.io/gloss/docs/"
title = "gloss"
theme = "hugo-book"
contentDir = "content"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Disable auto-generated timestamps for reproducible builds
enableGitInfo = false

[params]
  description = "A visual pager for the terminal: like less, for images, PDFs, meshes, and documents"

  # hugo-book theme params
  BookTheme = "auto"
  # The table of contents takes a column of the page. The theme lets a page
  # turn it off but not on, so it is on here, and pages too short to want
  # one say bookToC: false in their front matter.
  BookToC = true
  BookSection = "*"
  BookRepo = "https://github.com/NimbleTerminal/gloss"
  BookEditPath = "edit/main/docs/hugo"
  BookDateFormat = "January 2, 2006"
  BookSearch = true
  BookComments = false

# English lives at the root. The other languages are drafts under /es/ and
# /zh-hans/: they translate the guide's index, Using gloss and the home page,
# and link the rest of the guide in English by its site path.
[languages]
  [languages.en]
    weight = 1
    languageName = "English"
    languageCode = "en"
  [languages.es]
    weight = 2
    languageName = "Español"
    languageCode = "es"
    [languages.es.params]
      description = "Un paginador visual para la terminal: como less, para imágenes, PDF, mallas 3D y documentos"
  [languages.zh-hans]
    weight = 3
    languageName = "简体中文"
    languageCode = "zh-Hans"
    [languages.zh-hans.params]
      description = "终端里的可视化分页器：像 less 一样，可查看图片、PDF、三维网格和各类文档"

# The fonts are the landing page's: one copy, mounted into the site.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["en"]
  [[module.mounts]]
    source = "content.es"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["es"]
  [[module.mounts]]
    source = "content.zh-hans"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["zh-hans"]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../../web/fonts"
    target = "static/fonts"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]
